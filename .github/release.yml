name: Publicar nueva versión de Klaro

# Se ejecuta a mano: Actions > "Publicar nueva versión de Klaro" > Run workflow > escribes la versión (por ejemplo 1.3.0).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Número de versión (por ejemplo 1.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Poner el número de versión en la app
        shell: python
        env:
          V: ${{ inputs.version }}
        run: |
          import os, re, sys
          v = os.environ["V"].strip().lstrip("vV")
          if not re.fullmatch(r"\d+\.\d+\.\d+", v):
              sys.exit("La versión debe tener el formato 1.2.3")
          s = open("klaro_desktop.py", encoding="utf-8").read()
          s, n = re.subn(r'VERSION = "[0-9.]+"', 'VERSION = "%s"' % v, s, count=1)
          if n != 1:
              sys.exit("No encuentro la línea VERSION en klaro_desktop.py")
          open("klaro_desktop.py", "w", encoding="utf-8", newline="\n").write(s)

      - name: Instalar herramientas
        run: python -m pip install --upgrade pyinstaller pywebview

      - name: Crear el programa
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Klaro --icon klaro.ico --collect-all webview klaro_desktop.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear el instalador
        shell: pwsh
        env:
          V: ${{ inputs.version }}
        run: |
          $v = $env:V.Trim().TrimStart('v','V')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" klaro.iss
          if ($LASTEXITCODE -ne 0) { throw "Falló la creación del instalador" }

      - name: Calcular la huella de seguridad (SHA-256)
        shell: pwsh
        run: |
          $h = (Get-FileHash KlaroLauncherSetup.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path KlaroLauncherSetup.exe.sha256 -Value "$h  KlaroLauncherSetup.exe" -Encoding ascii

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Klaro ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            app/KlaroLauncherSetup.exe
            app/KlaroLauncherSetup.exe.sha256
